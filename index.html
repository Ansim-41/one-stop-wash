<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Stop Wash - Calicut | Car Wash & Detailing</title>

<meta name="description" content="One Stop Wash - Calicut. Professional car washing, auto detailing and air-freshener treatment in Malaparamba, Kozhikode.">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}


/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 7%;

    background:rgba(8,8,8,.82);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:1.5px;
}

.logo span{
    color:#aaa;
}

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links a{
    font-size:14px;
    color:#cfcfcf;
}

.nav-links a:hover{
    color:#fff;
}


/* HERO */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;

    padding:130px 7% 80px;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.90),
            rgba(0,0,0,.62),
            rgba(0,0,0,.35)
        ),
        url("wash-action.jpg");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:720px;
}

.badge{
    display:inline-flex;

    padding:8px 14px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;

    background:rgba(255,255,255,.08);

    color:#ddd;

    font-size:13px;

    margin-bottom:24px;
}

.hero h1{
    font-size:clamp(48px,8vw,86px);

    line-height:.95;

    letter-spacing:-3px;

    margin-bottom:25px;
}

.hero h1 span{
    color:#bdbdbd;
}

.hero-text{
    max-width:580px;

    font-size:18px;

    color:#c7c7c7;

    margin-bottom:32px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:14px 23px;

    border-radius:8px;

    font-size:14px;
    font-weight:700;

    transition:.25s;
}

.btn-primary{
    background:#fff;
    color:#000;
}

.btn-primary:hover{
    transform:translateY(-3px);
    background:#e7e7e7;
}

.btn-secondary{
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.07);
}

.btn-secondary:hover{
    background:rgba(255,255,255,.15);
    transform:translateY(-3px);
}


/* TRUST BAR */

.trust{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);

    background:#101010;
}

.trust-item{
    padding:28px 20px;

    text-align:center;

    border-right:1px solid rgba(255,255,255,.08);
}

.trust-item:last-child{
    border-right:none;
}

.trust-number{
    font-size:25px;
    font-weight:800;
}

.trust-label{
    color:#888;
    font-size:13px;
}


/* GENERAL SECTIONS */

section{
    padding:100px 7%;
}

.section-heading{
    max-width:700px;
    margin-bottom:50px;
}

.eyebrow{
    text-transform:uppercase;

    font-size:12px;
    font-weight:700;

    letter-spacing:2px;

    color:#999;

    margin-bottom:12px;
}

.section-heading h2{
    font-size:clamp(34px,5vw,55px);

    line-height:1.05;

    margin-bottom:16px;
}

.section-heading p{
    color:#8e8e8e;

    font-size:16px;
}


/* SERVICES */

.services{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap:18px;
}

.service-card{
    position:relative;

    padding:34px;

    min-height:260px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    transition:.3s;

    overflow:hidden;
}

.service-card:hover{
    transform:translateY(-7px);

    border-color:rgba(255,255,255,.22);
}

.service-icon{
    font-size:30px;

    margin-bottom:25px;
}

.service-card h3{
    font-size:21px;

    margin-bottom:12px;
}

.service-card p{
    color:#8f8f8f;

    font-size:14px;
}


/* GALLERY */

.gallery{
    background:#080808;
}

.gallery-grid{
    display:grid;

    grid-template-columns:
        1.25fr .75fr;

    gap:18px;
}

.gallery-card{
    position:relative;

    overflow:hidden;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.09);

    min-height:300px;

    background:#111;
}

.gallery-card.large{
    min-height:500px;
}

.gallery-card img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:transform .5s;
}

.gallery-card:hover img{
    transform:scale(1.04);
}

.gallery-label{
    position:absolute;

    left:18px;
    bottom:18px;

    padding:9px 13px;

    border-radius:20px;

    background:rgba(0,0,0,.65);

    backdrop-filter:blur(8px);

    font-size:12px;
}


/* ABOUT */

.about{
    background:#101010;
}

.about-grid{
    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    gap:70px;

    align-items:center;
}

.about-text h2{
    font-size:clamp(35px,5vw,55px);

    line-height:1.05;

    margin-bottom:22px;
}

.about-text p{
    color:#999;

    margin-bottom:18px;
}

.location-card{
    padding:35px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.09);

    background:#080808;
}

.location-card h3{
    font-size:20px;

    margin-bottom:15px;
}

.location-card p{
    color:#999;

    margin-bottom:25px;
}

.map-btn{
    display:inline-block;

    padding:12px 18px;

    border:1px solid #333;

    border-radius:7px;

    font-size:13px;

    font-weight:700;
}

.map-btn:hover{
    background:#fff;
    color:#000;
}


/* CONTACT */

.contact{
    text-align:center;

    background:
        linear-gradient(
            rgba(255,255,255,.035),
            rgba(255,255,255,.015)
        );
}

.contact-content{
    max-width:700px;

    margin:auto;
}

.contact h2{
    font-size:clamp(38px,6vw,65px);

    line-height:1;

    margin-bottom:18px;
}

.contact p{
    color:#888;

    margin-bottom:32px;
}

.contact-buttons{
    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}


/* FOOTER */

footer{
    padding:35px 7%;

    background:#050505;

    border-top:1px solid rgba(255,255,255,.08);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    color:#666;

    font-size:13px;
}

.footer-brand{
    color:#aaa;

    font-weight:700;
}


/* MOBILE */

@media(max-width:700px){

    nav{
        padding:17px 5%;
    }

    .nav-links{
        display:none;
    }

        padding:120px 5% 70px;

        background:

                90deg,
                rgba(0,0,0,.90),

            url("wash-action.jpg");

    }

        letter-spacing:-2px;
    }

    .hero-text{
        font-size:16px;
